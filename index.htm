<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Tarjeta AR - Fernando Galaviz</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        .btn {
            pointer-events: auto;
            padding: 12px 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <div id="ui-container">
        <a id="portfolio-btn" class="btn" href="https://www.linkedin.com/in/fernando-galaviz-llamas-854b24438" target="_blank">Ver Perfil Completo</a>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <a-marker preset="hiro" id="hiro-marker">
        </a-marker>

        <a-marker type="pattern" url="pattern-FERGLL.patt" id="reverso-marker">
            <a-image src="datos-ar.png" position="0 0.5 0" rotation="-90 0 0" scale="2 1.5 1"></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const reversoMarker = document.querySelector('#reverso-marker');
        const portfolioBtn = document.querySelector('#portfolio-btn');

        reversoMarker.addEventListener('markerFound', () => {
            portfolioBtn.style.display = 'block';
        });

        reversoMarker.addEventListener('markerLost', () => {
            portfolioBtn.style.display = 'none';
        });
    </script>
</body>
</html>
