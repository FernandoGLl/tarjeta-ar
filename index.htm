<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Tarjeta AR - Fernando Galaviz</title>
    <!-- Importar A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        .btn {
            pointer-events: auto;
            padding: 12px 24px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <div id="ui-container">
        <!-- Reemplaza el href con el enlace real a tu GitHub o portafolio -->
        <a id="portfolio-btn" class="btn" href="https://github.com/tu-usuario" target="_blank">Ver Portafolio de Proyectos</a>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <!-- FRENTE: Marcador Hiro por defecto -->
        <a-marker preset="hiro" id="hiro-marker">
            <a-entity position="0.5 0.5 0" rotation="-90 0 0">
                <a-text value="Fernando Galaviz Llamas" color="#2ecc71" position="0 0.4 0" scale="0.6 0.6 0.6"></a-text>
                <a-text value="Estudiante de Informatica" color="#ffffff" position="0 0.1 0" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
        </a-marker>

        <!-- REVERSO: Tu Marcador Personalizado FERGLL -->
        <a-marker type="pattern" url="pattern-FERGLL.patt" id="reverso-marker">
            <a-text value="Escaneaste el reverso.\n¡Conoce mis proyectos!" color="#3498db" position="0 0.5 0" rotation="-90 0 0" align="center"></a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const reversoMarker = document.querySelector('#reverso-marker');
        const portfolioBtn = document.querySelector('#portfolio-btn');

        reversoMarker.addEventListener('markerFound', () => {
            portfolioBtn.style.display = 'block';
        });

        reversoMarker.addEventListener('markerLost', () => {
            portfolioBtn.style.display = 'none';
        });
    </script>
</body>
</html>
